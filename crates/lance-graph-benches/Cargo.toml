[package]
name = "lance-graph-benches"
version = "0.1.0"
edition = "2021"
publish = false
description = "Benchmarks for lance-graph (not published)"

[dependencies]
lance-graph = { path = "../lance-graph", version = "0.5.4" }
lance = { version = "13.0.0", path = "../../../lance/rust/lance" }
arrow-array = "58.0"
arrow-schema = "58.0"
criterion = { version = "0.5", features = ["async", "async_tokio", "html_reports"] }
futures = "0.3"
tempfile = "3"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "graph_execution"
harness = false
