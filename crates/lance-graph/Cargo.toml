[package]
name = "lance-graph"
version = "0.5.4"
edition = "2021"
license = "Apache-2.0"
authors = ["Lance Devs <dev@lancedb.com>"]
repository = "https://github.com/lancedb/lance-graph"
readme = "README.md"
description = "Graph query engine for Lance datasets with Cypher support"
keywords = ["lance", "graph", "cypher", "query", "datafusion"]
categories = ["database", "data-structures", "science"]

[dependencies]
arrow = { version = "58.0", features = ["prettyprint"] }
arrow-array = "58.0"
arrow-schema = "58.0"
async-trait = "0.1"
datafusion = { version = "54.0", default-features = false, features = [
    "nested_expressions",
    "regex_expressions",
    "unicode_expressions",
    "crypto_expressions",
    "encoding_expressions",
    "datetime_expressions",
    "string_expressions",
    "parquet",
] }
datafusion-common = "54.0"
datafusion-expr = "54.0"
datafusion-sql = "54.0"
datafusion-functions-aggregate = "54.0"
futures = "0.3"
lance-graph-catalog = { path = "../lance-graph-catalog", version = "0.5.4" }
lance = { version = "13.0.0", path = "../../../lance/rust/lance", default-features = false }
lance-linalg = { version = "13.0.0", path = "../../../lance/rust/lance-linalg" }
lance-index = { version = "13.0.0", path = "../../../lance/rust/lance-index" }
lance-namespace = { version = "13.0.0", path = "../../../lance/rust/lance-namespace" }
nom = "7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.8"
tokio = { version = "1.37", features = ["time"] }
# The published Rust releases skip DataFusion 54; pin the official Python
# 1.6.2 release's compatible Rust sources instead of mixing DF 50/53/55 types.
deltalake = { git = "https://github.com/delta-io/delta-rs", rev = "dce52c6f10ee22753fec9aa1ff26e8f964175ef1", features = ["datafusion", "s3", "azure", "gcs"], optional = true }
url = { version = "2", optional = true }

[features]
default = ["unity-catalog", "delta", "aws", "azure", "gcp", "oss", "huggingface", "tencent", "tos", "goosefs", "geo"]
aws = ["lance/aws"]
azure = ["lance/azure"]
gcp = ["lance/gcp"]
oss = ["lance/oss"]
huggingface = ["lance/huggingface"]
tencent = ["lance/tencent"]
tos = ["lance/tos"]
goosefs = ["lance/goosefs"]
geo = ["lance/geo"]
hdfs = ["lance/hdfs"]
hdfs-jni = ["lance/hdfs-jni"]
qbfs = ["lance/qbfs"]
unity-catalog = ["lance-graph-catalog/unity-catalog"]
delta = ["dep:deltalake", "dep:url"]

[dev-dependencies]
futures = "0.3"
lance-arrow = { version = "13.0.0", path = "../../../lance/rust/lance-arrow" }
tempfile = "3"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }
